name: siqi
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  libghostty-spm:
    url: https://github.com/egoist-labs/libghostty-spm
    from: 1.3.7

settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Glint Dev Signing"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  siqi:
    type: application
    platform: macOS
    sources:
      - siqi
    dependencies:
      - package: libghostty-spm
        product: GhosttyTerminal
      - package: libghostty-spm
        product: GhosttyTheme
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.siqi.terminal
        PRODUCT_NAME: siqi
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: siqi/Resources/Info.plist
        ENABLE_HARDENED_RUNTIME: NO
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  siqi:
    build:
      targets:
        siqi: all
    run:
      config: Debug
